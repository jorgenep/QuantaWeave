[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantweave"
version = "0.1.0"
description = "Configurable dense and sparse Mixture-of-Experts language-model framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
]

[project.optional-dependencies]
data = ["datasets", "transformers", "tqdm", "huggingface_hub"]
tools = ["numpy", "pyyaml", "tokenizers", "psutil"]  # BPE, packed corpora, experiment configs, hardware probing
hf = ["transformers", "safetensors"]                 # Hugging Face teachers for cross-tokenizer distillation
gpu = ["triton", "bitsandbytes"]                    # grouped-GEMM expert kernels, 8-bit optimizers
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = []