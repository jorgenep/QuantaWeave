[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantweave"
version = "0.1.0"
description = "Configurable dense and sparse Mixture-of-Experts language-model framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
]

[project.optional-dependencies]
data = ["datasets", "transformers", "tqdm", "huggingface_hub"]
tools = ["numpy", "pyyaml", "tokenizers", "sentencepiece", "psutil"]  # BPE/SentencePiece, packed corpora, experiment configs, hardware probing
hf = ["transformers", "safetensors"]                 # Hugging Face teachers for cross-tokenizer distillation
gpu = ["triton", "bitsandbytes"]                    # grouped-GEMM expert kernels, 8-bit optimizers
export = ["onnx", "onnxruntime"]                    # ONNX export and its round-trip self-verification
serve = ["fastapi", "uvicorn"]                      # the HTTP inference server (serve_quantweave.py)
dev = ["pytest", "ruff"]
all = ["quantweave[data,tools,hf,export,serve,dev]"]  # everything exercised by the test suite except gpu (needs CUDA)

[tool.setuptools]
py-modules = []