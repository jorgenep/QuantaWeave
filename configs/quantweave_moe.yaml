# This file currently fine-tunes the dense initialization checkpoint. It is
# not a 30B/A1B MoE until a sparse MoE model implementation is supplied.
base_model: Qwen/Qwen3.8-27B
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

load_in_8bit: false
load_in_4bit: false
strict: false

datasets:
  - path: ./data/packed/packed_100B_dataset
    type: completion 

dataset_prepared_path: ./artifacts/prepared/last_run_prepared
output_dir: ./artifacts/outputs/quantweave-out

sequence_len: 4096
sample_packing: false 
pad_to_sequence_len: true

# --- NEW: Evaluation & Loss Curve Tracking ---
val_set_size: 0.005 # Reserves ~500M tokens specifically for validation loss curves
eval_strategy: "steps"
eval_steps: 500 # Calculates validation loss every 500 steps to watch for flatlining

wandb_project: quantweave-30b-100b
wandb_watch: gradients # Tracks gradient spikes that indicate data corruption
logging_steps: 10

# --- NEW: Checkpointing for HumanEval & Vibe Checks ---
save_strategy: "steps"
save_steps: 2000 # Saves a usable Hugging Face checkpoint every ~2000 steps
save_total_limit: 3 # Deletes older checkpoints so you don't run out of disk space
# ---------------------------------------------

gradient_accumulation_steps: 8
micro_batch_size: 4
num_epochs: 1
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 1.5e-4

train_on_inputs: false
group_by_length: false
bf16: auto
fp16: false
tf32: true
gradient_checkpointing: true
flash_attention: true

warmup_steps: 2000
weight_decay: 0.1
deepspeed: configs/deepspeed_zero3.json